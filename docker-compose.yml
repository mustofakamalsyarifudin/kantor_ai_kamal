services:
  postgres:
    image: postgres:16-alpine
    container_name: kantorai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kantorai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_DB_PASSWORD}
      POSTGRES_DB: kantorai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kantorai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kantorai -d kantorai"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: kantorai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - kantorai-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  kantorai-postgres-data:
  kantorai-redis-data:
